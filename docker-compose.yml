services:
  postgres:
    image: postgres:16-alpine
    restart: always
    env_file: .env
    ports:
      - "127.0.0.1:5340:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:6370:${REDIS_PORT}"

  migrate:
    build:
      context: ./backend
    command: sh -c "npm run drizzle:push"
    env_file:
      - .env
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    env_file:
      - .env
      - ./backend/.env
    ports:
      - "127.0.0.1:${BACKEND_PORT}:5001"
    depends_on:
      - migrate
      - redis

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
      - ./frontend/.env
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
